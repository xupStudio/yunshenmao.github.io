name: Migrate sync secrets to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Store Facebook token in Cloudflare
        run: |
          printf '%s' "$FB_PAGE_ACCESS_TOKEN" |
            npx --yes wrangler@4.115.0 secret put FB_PAGE_ACCESS_TOKEN \
              --config wrangler.site.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Store Gemini key in Cloudflare
        run: |
          printf '%s' "$GEMINI_API_KEY" |
            npx --yes wrangler@4.115.0 secret put GEMINI_API_KEY \
              --config wrangler.site.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
